<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Home Cari 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Anton', 'Impact', sans-serif; }
#svg-filters { position: absolute; width: 0; height: 0; }
#scene { position: fixed; inset: 0; perspective: 900px; }

/* SWISS FLAG */
#swiss { position: absolute; inset: 0; background: #D00000; display: flex; align-items: center; justify-content: center; filter: url(#fabric); transform-origin: center center; }
.swiss-cross { position: relative; width: min(52vw, 52vh); height: min(52vw, 52vh); filter: drop-shadow(0 0 30px rgba(0,0,0,0.35)); }
.swiss-cross::before, .swiss-cross::after { content: ''; position: absolute; background: white; }
.swiss-cross::before { width: 100%; height: 30%; top: 35%; left: 0; }
.swiss-cross::after  { width: 30%; height: 100%; left: 35%; top: 0; }

/* LENS FLARE */
#lens-flare { position: absolute; inset: 0; pointer-events: none; opacity: 0; overflow: hidden; z-index: 5; }
#lens-flare::before { content: ''; position: absolute; top: 50%; left: -30%; width: 160%; height: 2px; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0) 20%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 80%, transparent 100%); box-shadow: 0 0 40px 20px rgba(255,255,255,0.4); transform: rotate(-12deg) translateY(-50%); }
#lens-flare::after { content: ''; position: absolute; top: 46%; left: 20%; width: 60px; height: 60px; background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%); border-radius: 50%; }

/* SHUTTER */
#shutter { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 20; }

/* AUSTRIAN FLAG */
#austria { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; transform: scale(2.5) rotateX(8deg); transform-origin: center center; filter: url(#fabric); will-change: transform, opacity; }
.stripe-red   { flex: 1; background: #ED2939; }
.stripe-white { flex: 1; background: #FFFFFF; }

/* WELCOME */
#welcome { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; opacity: 0; gap: 0.05em; }
#welcome-text { font-size: clamp(2.4rem, 9vw, 7rem); color: white; text-align: center; letter-spacing: 0.08em; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.6), 0 0 60px rgba(0,0,0,0.4); transform: translateY(20px); opacity: 0; }
#welcome-sub  { font-size: clamp(5rem, 20vw, 15rem); color: white; text-align: center; letter-spacing: -0.02em; line-height: 0.85; text-shadow: 0 4px 8px rgba(0,0,0,0.5), 0 0 80px rgba(255,255,255,0.3); transform: scale(0.6); opacity: 0; }

/* BIRTHDAY SCREEN */
#birthday { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
#birthday-bg { position: absolute; inset: 0; background-image: url('photo.jpg'); background-size: cover; background-position: center 40%; transform: scale(1.05); }
#birthday-bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, rgba(10,25,10,0.05) 0%, rgba(10,25,10,0.55) 100%); }
#birthday-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px,1.5vw,18px); padding: 20px; }
#and-text { font-size: clamp(1.2rem,4.5vw,3.5rem); color: #f0f0e8; letter-spacing: 0.15em; text-shadow: 0 2px 6px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.5); opacity: 0; transform: translateY(12px); }

/* LETTER-BY-LETTER */
#bday-text { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.01em; line-height: 0.92; }
.bday-line { display: flex; width: 100%; justify-content: center; }
.bday-letter { display: inline-block; font-size: clamp(3rem, 13vw, 9.5rem); color: #F5E642; letter-spacing: -0.01em; text-shadow: 0 0 40px rgba(245,230,66,0.5), 3px 3px 0 rgba(0,0,0,0.4), 6px 6px 12px rgba(0,0,0,0.3); opacity: 0; transform: translateY(-60px) rotate(var(--rot,0deg)) scale(0.4); will-change: transform, opacity; }
@keyframes glow-pulse {
  0%,100% { text-shadow: 0 0 30px rgba(245,230,66,0.4), 3px 3px 0 rgba(0,0,0,0.4), 6px 6px 12px rgba(0,0,0,0.3); }
  50%      { text-shadow: 0 0 70px rgba(245,230,66,0.85), 0 0 120px rgba(255,200,0,0.4), 3px 3px 0 rgba(0,0,0,0.4); }
}

/* AGAIN BUTTON */
#again-btn { position: absolute; bottom: clamp(24px,5vw,48px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.12); backdrop-filter: blur(8px); border: 1.5px solid rgba(255,255,255,0.4); color: white; font-family: 'Anton', sans-serif; font-size: clamp(0.9rem,2.5vw,1.2rem); letter-spacing: 0.15em; padding: 10px 28px; border-radius: 40px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.6s, background 0.2s, transform 0.15s; }
#again-btn:hover  { background: rgba(255,255,255,0.22); transform: translateX(-50%) scale(1.04); }
#again-btn:active { transform: translateX(-50%) scale(0.97); }
#again-btn.visible { opacity: 1; pointer-events: all; }

/* CONFETTI */
#confetti-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.confetti-piece { position: absolute; top: -20px; border-radius: 2px; animation: confetti-fall linear forwards; }
@keyframes confetti-fall { 0% { opacity:1; } 80% { opacity:1; } 100% { transform: translateY(110vh) rotate(var(--spin)) scaleX(-1); opacity:0; } }
.sparkle { position: absolute; pointer-events: none; animation: sparkle-out 0.75s ease-out forwards; font-size: 1.6rem; z-index: 60; }
@keyframes sparkle-out { 0% { transform: scale(0) translate(0,0); opacity:1; } 100% { transform: scale(1.5) translate(var(--tx),var(--ty)); opacity:0; } }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>
</head>
<body>
<svg id="svg-filters" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fabric" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.65 0.65" numOctaves="4" seed="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="soft-light" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
</svg>

<div id="scene">
  <div id="swiss"><div class="swiss-cross"></div></div>
  <div id="lens-flare"></div>
  <div id="shutter"></div>
  <div id="austria">
    <div class="stripe-red"></div>
    <div class="stripe-white"></div>
    <div class="stripe-red"></div>
  </div>
  <div id="welcome">
    <div id="welcome-text">Welcome Home</div>
    <div id="welcome-sub">CARI</div>
  </div>
  <div id="birthday">
    <div id="birthday-bg"></div>
    <div id="birthday-content">
      <div id="and-text">…and…………</div>
      <div id="bday-text">
        <div class="bday-line" id="line1"></div>
        <div class="bday-line" id="line2"></div>
      </div>
    </div>
    <button id="again-btn">↩ again</button>
  </div>
  <div id="confetti-layer"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
function css(el, props) { Object.assign(el.style, props); }

// Build letters
const line1 = 'Happy'.split('');
const line2 = 'Birthday!!!!'.split('');
const rots = ['-4deg','-2deg','0deg','2deg','3deg','-1deg','1deg','-3deg','2deg','-2deg','1deg','-1deg'];
let li = 0;
for (const ch of line1) {
  const s = document.createElement('span'); s.className='bday-letter';
  s.textContent = ch===' '?'\u00A0':ch; s.style.setProperty('--rot', rots[li%rots.length]);
  $('line1').appendChild(s); li++;
}
for (const ch of line2) {
  const s = document.createElement('span'); s.className='bday-letter';
  s.textContent = ch===' '?'\u00A0':ch; s.style.setProperty('--rot', rots[li%rots.length]);
  $('line2').appendChild(s); li++;
}

// Audio
let audioCtx = null;
function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

function whoosh(ctx) {
  const sr = ctx.sampleRate, len = Math.floor(sr*0.9);
  const buf = ctx.createBuffer(1,len,sr); const d = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i=0;i<len;i++) { const w=Math.random()*2-1; b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.setValueAtTime(100,ctx.currentTime); hp.frequency.exponentialRampToValueAtTime(4000,ctx.currentTime+0.7);
  const g=ctx.createGain(); g.gain.setValueAtTime(0,ctx.currentTime); g.gain.linearRampToValueAtTime(1.8,ctx.currentTime+0.15); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.85);
  src.connect(hp); hp.connect(g); g.connect(ctx.destination); src.start(); src.stop(ctx.currentTime+0.9);
}

function chime(ctx) {
  [523.25,659.25,783.99,1046.5].forEach((freq,i) => {
    const osc=ctx.createOscillator(), g=ctx.createGain(); osc.type='sine'; osc.frequency.value=freq;
    const t=ctx.currentTime+i*0.08; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+1.4);
    osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+1.5);
  });
}

function drumroll(ctx, duration) {
  const interval=0.04, steps=Math.floor(duration/interval);
  for (let i=0;i<steps;i++) {
    const t=ctx.currentTime+i*interval, bsz=Math.floor(ctx.sampleRate*0.025);
    const buf=ctx.createBuffer(1,bsz,ctx.sampleRate); const d=buf.getChannelData(0);
    for (let j=0;j<bsz;j++) d[j]=(Math.random()*2-1)*(1-j/bsz);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=220+i*6;
    const g=ctx.createGain(); const vel=0.3+(i/steps)*0.7; g.gain.setValueAtTime(vel*0.5,t);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t+0.03);
  }
}

function partyHorn(ctx) {
  [261.63,329.63,392,523.25,659.25].forEach((freq,i) => {
    const osc=ctx.createOscillator(), g=ctx.createGain(); osc.type=i<2?'sawtooth':'square'; osc.frequency.value=freq; osc.detune.value=(Math.random()-0.5)*15;
    const t=ctx.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+0.04); g.gain.setValueAtTime(0.12,t+0.3); g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
    const dist=ctx.createWaveShaper(); const curve=new Float32Array(256);
    for (let j=0;j<256;j++){const x=(j*2/255)-1;curve[j]=Math.tanh(x*3)*0.6;} dist.curve=curve;
    osc.connect(dist); dist.connect(g); g.connect(ctx.destination); osc.start(t+i*0.02); osc.stop(t+1.3);
  });
  const sr=ctx.sampleRate, len=Math.floor(sr*0.8), buf=ctx.createBuffer(2,len,sr);
  for (let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let j=0;j<len;j++)d[j]=(Math.random()*2-1);}
  const crowd=ctx.createBufferSource(); crowd.buffer=buf;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,ctx.currentTime); g.gain.linearRampToValueAtTime(0.25,ctx.currentTime+0.1); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.75);
  crowd.connect(lp); lp.connect(g); g.connect(ctx.destination); crowd.start(); crowd.stop(ctx.currentTime+0.8);
}

let audioUnlocked = false;
function ensureAudio() { if(audioUnlocked)return; audioUnlocked=true; const c=getCtx(); if(c.state==='suspended')c.resume(); }
document.addEventListener('click', ensureAudio, {once:true});
document.addEventListener('touchstart', ensureAudio, {once:true});

// Alpine confetti
const alpineColors=['#4A90D9','#6DB35A','#F5E642','#FFFFFF','#E8F4FD','#C8E6A0','#2C5F8A','#FFD97D'];
function launchConfetti(intensity=1) {
  const layer=$('confetti-layer'), count=Math.floor(90*intensity);
  for(let i=0;i<count;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    const color=alpineColors[Math.floor(Math.random()*alpineColors.length)];
    const size=7+Math.random()*14, dur=2.5+Math.random()*3, del=Math.random()*0.8;
    p.style.cssText=`left:${Math.random()*105}vw;width:${size}px;height:${size}px;background:${color};border-radius:${Math.random()>0.4?'50%':'2px'};animation-duration:${dur}s;animation-delay:${del}s;--spin:${Math.floor(Math.random()*720)}deg;`;
    layer.appendChild(p); setTimeout(()=>p.remove(),(dur+del+0.2)*1000);
  }
}

// Sparkles
const sparkleEmoji=['🌸','✨','🎂','🎉','💛','🎈','⭐','🍀','🌼','🥂','🎊','💙'];
function spawnSparkles(x,y){
  for(let i=0;i<9;i++){
    const s=document.createElement('span'); s.className='sparkle';
    s.textContent=sparkleEmoji[Math.floor(Math.random()*sparkleEmoji.length)];
    const angle=(i/9)*360+Math.random()*25, dist=55+Math.random()*90;
    s.style.setProperty('--tx',Math.cos(angle*Math.PI/180)*dist+'px');
    s.style.setProperty('--ty',Math.sin(angle*Math.PI/180)*dist+'px');
    s.style.left=x+'px'; s.style.top=y+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}
document.addEventListener('click',e=>{ if(parseFloat($('birthday').style.opacity)>0) spawnSparkles(e.clientX,e.clientY); });
document.addEventListener('touchstart',e=>{ if(parseFloat($('birthday').style.opacity)>0){const t=e.touches[0];spawnSparkles(t.clientX,t.clientY);} },{passive:true});

// Screen shake
function screenShake(intensity=12,dur=400){
  const scene=$('scene'), start=performance.now();
  function frame(now){
    const el=now-start; if(el>=dur){scene.style.transform='';return;}
    const decay=1-el/dur;
    scene.style.transform=`translate(${(Math.random()-.5)*2*intensity*decay}px,${(Math.random()-.5)*2*intensity*decay*.6}px)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Letter drop-in
async function dropInLetters(){
  const letters=document.querySelectorAll('.bday-letter');
  letters.forEach((letter,i)=>{
    setTimeout(()=>{
      css(letter,{opacity:'1',transform:'translateY(0) rotate(0deg) scale(1)',transition:'opacity 0.18s ease, transform 0.45s cubic-bezier(0.15,0,0.2,1.6)'});
    },i*55);
  });
  await wait(letters.length*55+200);
  letters.forEach(l=>{l.style.animation='glow-pulse 2.2s ease-in-out infinite';});
}

// MAIN SEQUENCE
async function runSequence(){
  const ctx=getCtx();
  await wait(700);

  // Phase 2: Zoom through Swiss flag — pitch back in 3D
  css($('swiss'),{transition:'transform 0.85s cubic-bezier(0.3,0,0.5,1), filter 0.6s, opacity 0.35s',transform:'scale(4) rotateX(-5deg)',filter:'url(#fabric) brightness(1.5)'});

  await wait(360);
  css($('lens-flare'),{opacity:'1',transition:'opacity 0.07s'});
  await wait(130);
  css($('lens-flare'),{opacity:'0',transition:'opacity 0.22s'});

  await wait(160);
  // Shutter punch-through
  css($('shutter'),{opacity:'1',background:'white',transition:'opacity 0.05s'});
  whoosh(ctx);
  await wait(75);
  css($('shutter'),{opacity:'0',transition:'opacity 0.28s'});

  // Phase 3: Austrian flag comes in with rotateX depth
  css($('austria'),{opacity:'1',transform:'scale(1) rotateX(0deg)',transition:'opacity 0.45s ease, transform 1.1s cubic-bezier(0.1,0,0.2,1)',filter:'url(#fabric) brightness(1.05)'});
  css($('swiss'),{opacity:'0',transition:'opacity 0.35s'});

  await wait(900);

  // Phase 4: Welcome Home
  css($('welcome'),{opacity:'1',transition:'none'});
  css($('welcome-text'),{opacity:'1',transform:'translateY(0)',transition:'opacity 0.3s ease, transform 0.45s cubic-bezier(0.15,0,0.3,1.2)'});
  await wait(360);
  css($('welcome-sub'),{opacity:'1',transform:'scale(1)',transition:'opacity 0.12s, transform 0.5s cubic-bezier(0.1,0,0.15,1.5)'});
  chime(ctx);
  await wait(180);
  screenShake(5,280);

  await wait(1900);

  // Phase 5: Zoom into red stripe
  css($('welcome-text'),{opacity:'0',transform:'translateY(-8px)',transition:'opacity 0.28s, transform 0.28s'});
  css($('welcome-sub'),{opacity:'0',transform:'scale(1.12)',transition:'opacity 0.28s, transform 0.28s'});
  await wait(200);
  css($('austria'),{transform:'scale(20) rotateX(3deg)',transition:'transform 0.8s cubic-bezier(0.35,0,0.65,1)',filter:'url(#fabric) brightness(1.25)'});

  await wait(480);
  css($('shutter'),{opacity:'1',background:'#ED2939',transition:'opacity 0.18s'});
  await wait(230);

  // Phase 6: Birthday screen
  css($('birthday'),{opacity:'1',pointerEvents:'all',transition:'none'});
  css($('welcome'),{opacity:'0',transition:'none'});
  css($('shutter'),{opacity:'0',transition:'opacity 0.18s'});
  css($('austria'),{opacity:'0',transition:'none'});

  await wait(200);

  css($('and-text'),{opacity:'1',transform:'translateY(0)',transition:'opacity 0.6s ease, transform 0.6s cubic-bezier(0.2,0,0.3,1)'});

  drumroll(ctx, 0.95);
  await wait(950);

  // Phase 7: Letters explode in
  partyHorn(ctx);
  screenShake(16,500);
  await dropInLetters();

  launchConfetti(1.2);
  await wait(400);
  launchConfetti(0.7);
  await wait(600);
  launchConfetti(0.5);

  await wait(1000);
  $('again-btn').classList.add('visible');
}

$('again-btn').addEventListener('click', ()=>location.reload());
window.addEventListener('load', ()=>setTimeout(runSequence,400));
</script>
</body>
</html>
